name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every third-party action is pinned to an immutable full commit SHA with an
# adjacent comment naming the human-readable release (M-6 supply-chain
# hardening). A mutable tag (@v4, @main, @stable) could be re-pointed at
# malicious code by a compromised action account; a commit SHA cannot.
#
# To update a pinned action deliberately:
#   1. Find the new release's commit SHA:
#        gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq '.object.sha'
#      (dereference annotated tags via repos/<owner>/<repo>/git/tags/<sha>).
#   2. Replace the SHA and update the trailing "# <version>" comment.
#   3. Review the diff between the old and new SHA before merging.

# Least privilege: CI only reads the repository. No job publishes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (core + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          # The SHA pins the action code; `toolchain` selects the Rust
          # release explicitly (a pinned SHA can no longer infer it from the
          # branch name).
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p api-tracker-core -p api-tracker-cli -p api-tracker-observe -p api-tracker-gateway -p api-tracker-tracking --all-targets -- -D warnings
      - name: Tests
        env:
          API_TRACKER_INSECURE_FAST_KDF: "1"
        # api-tracker-observe is included so the runtime-observability proxy,
        # sanitizer, and (security-critical) vault-lock lifecycle tests run in
        # CI — previously observe's own test targets were never executed by CI.
        # api-tracker-gateway is added in the same commit that creates the
        # crate (KNOWN_CONFLICTS C9: the explicit -p lists give a new crate
        # zero coverage unless it is listed here).
        run: cargo test -p api-tracker-core -p api-tracker-cli -p api-tracker-observe -p api-tracker-gateway -p api-tracker-tracking

  rust-windows:
    name: Rust core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Tests (compiles the Credential Manager adapter on real Windows)
        env:
          API_TRACKER_INSECURE_FAST_KDF: "1"
        # api-tracker-gateway is included so the gateway's Windows build
        # (Unix-only control channel cfg-gated out — ADR 0019 D8) is
        # compiled and tested on a real Windows runner.
        run: cargo test -p api-tracker-core -p api-tracker-gateway -p api-tracker-tracking
      - name: Build the CLI (compile-validates the Windows service lifecycle)
        # Phase 3 requirement: the full CLI — including the HKCU Run-key
        # lifecycle and gateway command family — must COMPILE on real
        # Windows. Behavioral Windows validation has never been performed
        # and is not claimed (KNOWN_CONFLICTS C13).
        run: cargo build -p api-tracker-cli

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop backend (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend (required by tauri::generate_context!)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Stage the bundled CLI sidecar (required by externalBin)
        run: bash scripts/bundle_cli.sh
      - name: Clippy (desktop backend)
        run: cargo clippy -p api-tracker-desktop -- -D warnings

  packaged-macos:
    name: Packaged app + validation (macOS)
    runs-on: macos-latest
    # A full bundle build plus the smoke suite (production Argon2id, no fast-KDF
    # escape hatch) is the slowest job here; the cap is a guard against a hang,
    # not a budget.
    timeout-minutes: 60
    # WHAT THIS JOB IS FOR, AND WHAT IT DELIBERATELY DOES NOT CLAIM
    # -------------------------------------------------------------
    # ZFT-VAL-1 found that CI ran NEITHER scripts/tracking_validate_macos.sh
    # NOR scripts/smoke.sh, and never built a packaged app on any platform —
    # so the "packaged validation" evidence was one developer-machine run.
    # This job builds the real .app and runs both scripts on every PR.
    #
    # It runs the packaged validation at `--scope offline`, which is the
    # largest scope a hosted runner can execute HONESTLY:
    #
    #   REQUIRED here (20 checks, every one of them fails the build):
    #     - the bundle carries a runnable native helper at Contents/MacOS
    #     - the helper's MEASURED --version equals the bundle's Info.plist
    #       version, and its bytes equal the sidecar staged from this source
    #     - the helper answers the exec probe with every developer CLI
    #       stripped off PATH
    #     - `track --dry-run` detects, prints the exact env diff, leaks
    #       neither the key nor an unrelated env value, and changes the .env
    #       not one byte
    #     - the harness mutation test: deliberately-false controls must be
    #       reported as FAILURES (a harness that always says "ok" fails here)
    #
    #   NOT run here, and therefore NOT claimed by a green build:
    #     - LaunchAgent registration, traffic observation, verification,
    #       privacy-at-rest and undo. Those need a running gateway and a real
    #       provider request, and they now have their own required job:
    #       `.github/workflows/packaged-service-macos.yml`, which runs
    #       `--scope full --require-service` on a clean hosted runner.
    #
    #       CORRECTION. This block used to say a hosted runner "has no login
    #       session to register into" and that `launchctl bootstrap gui/<uid>`
    #       "behaves differently under Actions than on a real desktop". That
    #       was asserted, never measured, and it is FALSE. Measured on
    #       macos-26-arm64 (run 30323981718): `launchctl managername` reports
    #       Aqua, `gui/501` exists and is created by `loginwindow`, bootstrap
    #       returns 0, and the agent genuinely runs. The claim had the effect
    #       of retiring the strongest available scope on a technical premise
    #       nobody had checked — which is worth more attention than the
    #       missing coverage itself, because a wrong reason for not testing
    #       survives longer than a gap somebody can see.
    #
    # The script prints its own "NOT RUN HERE" block for the scope it ran, so
    # the log states the boundary rather than relying on this comment.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # First, and before anything it certifies: prove the harness can report a
      # failure. This mode needs no app bundle, so it fails in seconds rather
      # than after a bundle build.
      - name: Validation harness self-check (anti-tautology gate)
        run: bash scripts/tracking_validate_macos.sh --scope selfcheck
      # ...and prove that gate is not itself decorative: seven mutants that
      # weaken the harness into "always ok" (including the literal ZFT-VAL-7
      # and ZFT-VAL-10 defects) must each be killed by the self-check. Runs on
      # copies under mktemp; starts no service and touches no repository file.
      - name: Validation harness mutation test (the gate must kill its mutants)
        run: bash scripts/validation_harness_mutants.sh
      # The harness's teardown does a `launchctl bootout` and an `rm -f`, both
      # bounded entirely by the ownership ledger. Until now that boundary was
      # reachable only from `--scope full --mode service`, which cannot run on
      # a developer machine beside a live gateway — so a dead field extractor
      # sent every run through a filename glob for months without anything
      # noticing (VAL-02). These drive the primitives directly against a fake
      # $HOME: no gateway, no service, no launchctl.
      - name: Validation ownership tests (cleanup authority, never a glob)
        run: bash scripts/validation_ownership_tests.sh
      # The gate that certifies the whole service scope used to read its own
      # expectations out of the artifact it was validating, so a twelve-line
      # forgery declaring zero checks printed "SERVICE SCOPE COMPLETED: 0/0"
      # and exited 0 (VAL-01). These two steps guard the replacement: the
      # manifest must describe the harness that actually exists, and the
      # validator must accept exactly one genuine result out of thirty-three
      # documents — including the audit's own forgery, replayed verbatim.
      - name: Trusted manifest matches the harness's group table
        run: bash scripts/validation_manifest_check.sh
      - name: Service-results forgery tests (the gate must refuse forgeries)
        run: bash scripts/validation_asserter_tests.sh
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Stage the bundled CLI sidecar (externalBin — the app ships its helper)
        run: bash scripts/bundle_cli.sh
      # `--bundles app` builds the real .app (the artifact the validation
      # inspects) and skips the .dmg, which adds minutes and proves nothing the
      # .app does not. Unsigned: no signing identity exists on a hosted runner,
      # and the alpha ships unsigned (docs/PACKAGING.md).
      - name: Build the real macOS app bundle
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles app
      - name: Packaged validation (offline scope — REQUIRED)
        run: bash scripts/tracking_validate_macos.sh --scope offline
      - name: Smoke suite (release binary, throwaway vault, no network)
        run: bash scripts/smoke.sh

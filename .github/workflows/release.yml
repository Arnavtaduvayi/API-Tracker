name: Release

# Builds CLI + desktop artifacts for macOS, Windows, and Linux when a version
# tag (v*) is pushed, generates SHA-256 checksums, and attaches everything to a
# GitHub Release. Artifacts are UNSIGNED (public alpha) — see
# docs/PACKAGING.md for signing/notarization requirements.
#
# Every third-party action is pinned to an immutable full commit SHA with an
# adjacent version comment (M-6 supply-chain hardening); this workflow can
# publish releases, so an unpinned action here is a direct supply-chain risk.
# To update a pin deliberately, resolve the new release's SHA
# (`gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq '.object.sha'`),
# swap the SHA + version comment, and review the SHA-to-SHA diff first.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege at the workflow level: build jobs only read. The jobs that
# attach artifacts to the release request `contents: write` for themselves.
permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    # Build + artifact upload only; inherits the workflow-level read scope.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Build CLI
        run: cargo build --release -p api-tracker-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/api-tracker"
          out="api-tracker-${{ matrix.target }}"
          tar -czf "$out.tar.gz" -C "$(dirname "$bin")" api-tracker
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/api-tracker.exe"
          out="api-tracker-${{ matrix.target }}"
          cp "$bin" "api-tracker.exe"
          7z a "$out.zip" api-tracker.exe
          certutil -hashfile "$out.zip" SHA256 > "$out.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          path: |
            api-tracker-*.tar.gz*
            api-tracker-*.zip*

  desktop:
    name: Desktop (${{ matrix.os }})
    # tauri-action creates/updates the draft release, so this job needs write.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      # tauri-action builds the app and uploads the bundles to the release for
      # the tag that triggered this workflow. Artifacts are unsigned.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Tethra ${{ github.ref_name }} (alpha)"
          releaseBody: "Unsigned public-alpha build. See docs/INSTALL.md and docs/PACKAGING.md."
          releaseDraft: true
          prerelease: true

  cli-release:
    name: Attach CLI artifacts + checksums
    needs: cli
    # This job attaches the CLI archives + SHA256SUMS.txt to the release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      # No `|| true`: if checksum generation fails, fail the job rather than
      # publishing artifacts without an integrity manifest.
      - name: Combined checksums
        run: cd dist && sha256sum api-tracker-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: true
          files: |
            dist/api-tracker-*
            dist/SHA256SUMS.txt

[package]
name = "gateway-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

# Standalone on purpose: this package is an isolated feasibility experiment for
# the Local Gateway architecture phase (docs/gateway/). It is NOT a member of
# the root workspace, NOT production code, and NOT built by CI. The empty
# [workspace] table below detaches it from the root workspace so `cargo test`
# at the repository root never compiles it. It exists to answer the feasibility
# questions recorded in docs/gateway/HANDOFF_PHASE_1.md and is expected to be
# deleted once the production `crates/gateway` implementation lands.
[workspace]

[dependencies]
api-tracker-core = { path = "../../crates/core" }
api-tracker-observe = { path = "../../crates/observe" }
blake3 = "1"
zeroize = "1"
serde_json = "1"

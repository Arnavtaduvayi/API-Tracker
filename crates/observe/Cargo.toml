[package]
name = "api-tracker-observe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The runtime-observation proxy: a loopback-only, per-session, authenticated
# HTTPS-interception proxy plus the local certificate authority that makes
# scoped TLS metadata capture possible. This is a materially different trust
# surface from the rest of the workspace (listening sockets, TLS termination,
# a CA private key) so it lives in its own crate with its own dependency set
# and its own `forbid(unsafe_code)`.
#
# Every TLS-relevant dependency here (rustls, rustls-pki-types, webpki-roots,
# httparse, socket2) is already present in the workspace lockfile via ureq/
# hyper, so this crate adds exactly ONE genuinely new dependency, `rcgen`,
# configured onto the already-vendored `ring` backend (no aws-lc, no openssl,
# no native-tls, no tokio, no hyper).

[dependencies]
api-tracker-core = { version = "0.1.0", path = "../core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
httparse = "1.10"
socket2 = "0.6"
base64 = "0.22"
sha2 = "0.10"
# The session writer thread owns its own SQLite connection to persist observed
# metadata off the proxy threads. Same pinned version/features as the core crate.
rusqlite = { version = "0.40.1", features = ["bundled"] }
time = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

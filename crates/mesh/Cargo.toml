# Tethra Mesh networking (ADR 0031): the ONLY network code of the mesh. It
# drives `api-tracker-core::mesh` (pure, sans-IO) over Noise on TCP: pairing,
# authenticated replication sessions, the accept loop, one-shot exchanges.
#
# Dependency policy: std threads, no async runtime (like the gateway). Two
# third-party crates of its own: `snow` (Noise), with only the
# ChaCha20-Poly1305, BLAKE2s, Curve25519 and getrandom backends enabled (it
# reuses curve25519-dalek 4.1.3, blake2 0.10 and subtle from the lockfile),
# and `mdns-sd` for opt-in discovery (ADR 0031 "Dependencies").

[package]
name = "api-tracker-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
api-tracker-core = { version = "0.1.0", path = "../core" }
snow = { version = "0.10.0", default-features = false, features = ["std", "default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zeroize = { version = "1.9.0", features = ["derive"] }
blake3 = { version = "1.8.5", features = ["zeroize"] }
# Opt-in LAN discovery (`serve --discover`), no async runtime and no logging
# backend; never constructed in tests (ADR 0031 "Dependencies").
mdns-sd = { version = "0.21.6", default-features = false }
# Interface addresses for a node bound to every interface (`--all-interfaces`);
# already in the tree through mdns-sd.
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
api-tracker-core = { path = "../core", features = ["mesh-sim"] }

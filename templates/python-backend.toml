# Project template: Python backend service.
id = "python-backend"
name = "Python backend"
description = "A Python service (FastAPI/Flask/Django) holding service keys."
providers = []
environments = ["development", "staging", "production"]
docs = []
destinations = ["env_mapping", "env_export", "github_actions"]
credential_separation = """
One variable per external service, one credential per environment. Prefer
`api-tracker run` (runtime injection) over .env files; if a framework needs
a file, use a temporary export with a TTL so plaintext does not linger.
Django's SECRET_KEY must be unique per environment and never reused from a
tutorial."""
permission_guidance = """
Scope database users and third-party keys to least privilege; avoid
project-wide admin tokens inside request-serving code."""
rotation_guidance = """
Attach production credentials to their deployment destination so a rotation
deploys and verifies in one reviewed plan."""

[[env]]
name = "DATABASE_URL"
secret = true
description = "Connection string; treat as secret (embeds the password)."

[[env]]
name = "SECRET_KEY"
secret = true
description = "Framework signing secret (e.g. Django); random per env."

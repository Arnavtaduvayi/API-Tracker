# Project template: Node.js backend service.
id = "node-backend"
name = "Node.js backend"
description = "A Node.js server (Express/Fastify/Hono) holding service keys."
providers = []
environments = ["development", "staging", "production"]
docs = []
destinations = ["env_mapping", "env_export", "github_actions"]
credential_separation = """
Give every external service its own variable and its own per-environment
credential. Prefer `tethra run` (runtime injection) over a .env file in
development — nothing lands on disk. Keep DATABASE_URL's password distinct
per environment. The legacy `api-tracker` command remains a compatibility
alias for `tethra` (see docs/rebrand/TETHRA_MIGRATION_GUIDE.md)."""
permission_guidance = """
Scope each service credential to the least privilege the server needs;
database users should not be superusers, and third-party keys should be
restricted where the provider supports it."""
rotation_guidance = """
Attach production credentials to their deployment destination in Tethra
so a rotation deploys and verifies in one reviewed plan."""

[[env]]
name = "DATABASE_URL"
secret = true
description = "Connection string; treat as secret (embeds the password)."

[[env]]
name = "SESSION_SECRET"
secret = true
description = "Cookie/session signing secret; generate randomly per env."

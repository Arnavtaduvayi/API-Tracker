# Together AI provider manifest.
id = "together"
name = "Together AI"
description = "Together AI inference platform (OpenAI-compatible chat, embeddings, images)."
website = "https://www.together.ai"
api_docs_url = "https://docs.together.ai/reference"
auth_docs_url = "https://docs.together.ai/docs/quickstart"
manage_url = "https://api.together.xyz/settings/api-keys"
pricing_url = "https://www.together.ai/pricing"
login_url = "https://api.together.xyz/"
billing_url = "https://api.together.xyz/settings/billing"
# Verified against the official together-python client:
# `api_key = os.environ.get("TOGETHER_API_KEY")`.
env_vars = ["TOGETHER_API_KEY"]
credential_types = ["api_key"]
expiration = "No key expiration is documented; keys stay valid until revoked in the dashboard."
watch_docs = [
    "https://docs.together.ai/reference",
    "https://docs.together.ai/docs/quickstart",
]
# No detection pattern: Together AI keys are undelimited hex strings with no
# documented prefix, so any regex would be a generic high-entropy matcher and
# would fire on unrelated hashes. Name-based detection (TOGETHER_API_KEY) is
# the honest signal here.

# Local Gateway routing (ADR 0019 D10). Verified against the official
# together-python client:
#   * base URL env var: `base_url = os.environ.get("TOGETHER_BASE_URL")`
#   * default base URL: `https://api.together.xyz/v1`
#   * API key env var:  `TOGETHER_API_KEY`
# The default base URL itself ends in /v1 and the SDK appends bare route names
# to it, so the written loopback URL must reproduce that suffix — hence
# base_path = "/v1", the OpenAI-style placement (OPEN_DECISIONS O11).
[gateway]
origins = ["https://api.together.xyz"]
base_path = "/v1"
env_vars = ["TOGETHER_BASE_URL"]
# /v1/chat/completions is OpenAI-compatible and reports
# usage.prompt_tokens / usage.completion_tokens.
usage_shape = "openai"

[capabilities]
validate_credential = { support = "supported_not_implemented", attribution = "exact_credential", note = "An authenticated GET /v1/models would confirm the key; Tethra has no Together connector yet." }
fetch_metadata = { support = "manual_only", note = "Key metadata is shown in the dashboard; no public key-management API is documented." }
fetch_usage = { support = "manual_only", attribution = "account_level", note = "Usage and spend are shown in the dashboard; no public usage API is documented. Per-response token counts remain observable locally through the Local Gateway." }
read_permissions = { support = "unsupported", note = "Together AI keys carry no documented per-key scopes." }
change_permissions = { support = "unsupported", note = "There are no documented per-key scopes to change." }
create_credential = { support = "manual_only", note = "Keys are created in the dashboard; no key-creation API is documented." }
disable_credential = { support = "unsupported", note = "No disable state is documented; keys are revoked instead." }
revoke_credential = { support = "manual_only", note = "Keys are revoked in the dashboard; no key-deletion API is documented." }
rotate_credential = { support = "manual_only", note = "Create a replacement key in the dashboard, deploy it, then revoke the old one." }
fetch_pricing = { support = "manual_only", note = "Pricing is published on the pricing page; there is no official pricing API." }

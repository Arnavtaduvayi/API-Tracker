# Anthropic provider manifest.
id = "anthropic"
name = "Anthropic"
description = "Anthropic API platform (Claude models)."
website = "https://www.anthropic.com"
api_docs_url = "https://docs.anthropic.com/en/api"
auth_docs_url = "https://docs.anthropic.com/en/api/overview"
manage_url = "https://console.anthropic.com/settings/keys"
changelog_url = "https://docs.anthropic.com/en/release-notes/api"
pricing_url = "https://www.anthropic.com/pricing"
permissions_docs_url = "https://docs.anthropic.com/en/api/administration-api"
env_vars = ["ANTHROPIC_API_KEY", "ANTHROPIC_ADMIN_KEY"]
credential_types = ["api_key", "admin_key"]
expiration = "Keys can be given an expiration at creation (presets or custom) or 'Never'; otherwise they remain valid until deactivated."
watch_docs = [
    "https://docs.anthropic.com/en/api/versioning",
    "https://docs.anthropic.com/en/api/overview",
]

[[detection]]
name = "anthropic-api-key"
regex = "sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{80,}"
confidence = "high"

[[detection]]
name = "anthropic-admin-key"
regex = "sk-ant-admin[0-9]{2}-[A-Za-z0-9_-]{80,}"
confidence = "high"

[[detection]]
name = "anthropic-key-generic"
regex = "sk-ant-[A-Za-z0-9_-]{20,}"
confidence = "medium"

[capabilities]
validate_credential = { support = "implemented", attribution = "exact_credential", note = "A lightweight authenticated GET /v1/models confirms the key is accepted." }
fetch_metadata = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "Workspace and API-key metadata (ids, names, status, partial hints, provider-reported expirations) sync via the Admin API." }
fetch_usage = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "Daily token usage syncs grouped by provider API-key id, workspace, and model (per-key grouping is officially supported). Rows are exact-credential ONLY for key ids you explicitly linked; others stay at provider-key/workspace/account level. Provider-reported costs sync at workspace granularity — the cost API has no per-key grouping, and cost is never divided among keys." }
read_permissions = { support = "unsupported", note = "Keys are scoped by workspace membership, not by API-readable per-key scopes." }
change_permissions = { support = "unsupported", note = "Per-key permissions cannot be changed through a public API." }
create_credential = { support = "manual_only", note = "API keys can only be created in the console, not through the Admin API." }
disable_credential = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "API Tracker sets status=inactive via the Admin API and verifies the returned status; requires an admin key." }
revoke_credential = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "Soft revoke only: API Tracker sets status=archived via the Admin API and says so — there is no hard-delete endpoint." }
rotate_credential = { support = "manual_only", note = "Semi-automated in API Tracker's rotation workflow: the new key must be created in the console (no create API); deactivating/archiving the old key then happens via the Admin API." }
fetch_pricing = { support = "manual_only", note = "Pricing is published on the pricing page; there is no official pricing API." }

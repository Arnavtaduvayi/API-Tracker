# Fireworks AI provider manifest.
id = "fireworks"
name = "Fireworks AI"
description = "Fireworks AI inference platform (OpenAI-compatible chat, embeddings, images)."
website = "https://fireworks.ai"
api_docs_url = "https://docs.fireworks.ai/api-reference/introduction"
auth_docs_url = "https://docs.fireworks.ai/getting-started/quickstart"
manage_url = "https://app.fireworks.ai/settings/users/api-keys"
pricing_url = "https://fireworks.ai/pricing"
login_url = "https://app.fireworks.ai/"
# Verified against the official Fireworks Python SDK, which infers `api_key`
# from `FIREWORKS_API_KEY`.
env_vars = ["FIREWORKS_API_KEY"]
credential_types = ["api_key"]
expiration = "No key expiration is documented; keys stay valid until deleted in the dashboard."
watch_docs = [
    "https://docs.fireworks.ai/api-reference/introduction",
    "https://docs.fireworks.ai/getting-started/quickstart",
]
# No detection pattern: the official documentation does not publish the key
# format, so none is declared.

# Local Gateway routing (ADR 0019 D10). Verified against the official
# Fireworks Python SDK:
#   * base URL env var: `base_url = os.environ.get("FIREWORKS_BASE_URL")`
#   * default base URL: `https://api.fireworks.ai`
#   * API key env var:  `FIREWORKS_API_KEY`
# The default base URL is a bare origin — the SDK carries `/inference/v1` in
# its own route strings — so base_path stays empty.
[gateway]
origins = ["https://api.fireworks.ai"]
base_path = ""
env_vars = ["FIREWORKS_BASE_URL"]
# /inference/v1/chat/completions is OpenAI-compatible and reports
# usage.prompt_tokens / usage.completion_tokens.
usage_shape = "openai"

[capabilities]
validate_credential = { support = "supported_not_implemented", attribution = "exact_credential", note = "An authenticated GET /inference/v1/models would confirm the key; Tethra has no Fireworks connector yet." }
fetch_metadata = { support = "manual_only", note = "Key metadata is shown in the dashboard; no public key-management API is documented." }
fetch_usage = { support = "manual_only", attribution = "account_level", note = "Usage and spend are shown in the dashboard; no public usage API is documented. Per-response token counts remain observable locally through the Local Gateway." }
read_permissions = { support = "unsupported", note = "Fireworks API keys carry no documented per-key scopes." }
change_permissions = { support = "unsupported", note = "There are no documented per-key scopes to change." }
create_credential = { support = "manual_only", note = "Keys are created in the dashboard; no key-creation API is documented." }
disable_credential = { support = "unsupported", note = "No disable state is documented; keys are deleted instead." }
revoke_credential = { support = "manual_only", note = "Keys are deleted in the dashboard; no key-deletion API is documented." }
rotate_credential = { support = "manual_only", note = "Create a replacement key in the dashboard, deploy it, then delete the old one." }
fetch_pricing = { support = "manual_only", note = "Pricing is published on the pricing page; there is no official pricing API." }

# OpenAI provider manifest.
# Capability statuses are honest declarations: no provider connector is
# implemented in this milestone, so nothing is "implemented".
id = "openai"
name = "OpenAI"
description = "OpenAI API platform (GPT models, embeddings, etc.)."
website = "https://openai.com"
api_docs_url = "https://platform.openai.com/docs/api-reference"
auth_docs_url = "https://platform.openai.com/docs/api-reference/authentication"
manage_url = "https://platform.openai.com/api-keys"
changelog_url = "https://platform.openai.com/docs/changelog"
pricing_url = "https://openai.com/api/pricing/"
permissions_docs_url = "https://platform.openai.com/docs/api-reference/authentication"
# env_vars lists SECRET-bearing variables only (used for scan detection);
# non-secret vars like OPENAI_ORG_ID / OPENAI_PROJECT_ID are deliberately excluded.
env_vars = ["OPENAI_API_KEY", "OPENAI_ADMIN_KEY"]
credential_types = ["user_api_key", "project_api_key", "service_account_key", "admin_key"]
expiration = "API keys do not expire automatically; they remain valid until revoked."
watch_docs = [
    "https://platform.openai.com/docs/api-reference/authentication",
    "https://platform.openai.com/docs/deprecations",
]

[[detection]]
name = "openai-project-key"
regex = "sk-proj-[A-Za-z0-9_-]{20,}"
confidence = "high"

[[detection]]
name = "openai-service-account-key"
regex = "sk-svcacct-[A-Za-z0-9_-]{20,}"
confidence = "high"

[[detection]]
name = "openai-legacy-key"
regex = "sk-[A-Za-z0-9]{32,}"
confidence = "medium"

[capabilities]
validate_credential = { support = "implemented", attribution = "exact_credential", note = "A lightweight authenticated GET /v1/models confirms the key is accepted." }
fetch_metadata = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "API Tracker lists the organization's projects and each project's API keys (id, name, redacted value) via the Admin API; requires an organization admin key." }
fetch_usage = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "API Tracker syncs daily token usage grouped by provider project, API-key id, and model, plus provider-reported costs grouped by project, API-key id, and line item (admin key). Rows are attributed as exact-credential ONLY for provider key ids the user has explicitly linked to a vault credential; unlinked rows stay at provider-key/project/account level and are never divided among local keys. Token detail currently covers the completions usage endpoint; reported costs cover all products." }
read_permissions = { support = "manual_only", note = "The API does not return a key's endpoint scopes; per-key permission tiers are viewable only in the dashboard." }
change_permissions = { support = "manual_only", note = "A key's endpoint scopes can be changed only in the dashboard, not via API." }
create_credential = { support = "implemented", requires_admin_credential = true, attribution = "provider_project_level", note = "API Tracker creates service-account keys inside a chosen provider project via the Admin API. User keys remain dashboard-only." }
disable_credential = { support = "unsupported", note = "There is no disable action; keys are deleted instead." }
revoke_credential = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "API Tracker deletes project/service-account keys by id via the Admin API (permanent — OpenAI has no disable state). Personal keys are dashboard-only." }
rotate_credential = { support = "implemented", requires_admin_credential = true, attribution = "exact_credential", note = "No single provider endpoint; API Tracker's rotation workflow composes Admin-API creation, verified deployment, a grace period, and Admin-API deletion of the old key. Personal (dashboard-created) keys still need the manual-create path." }
fetch_pricing = { support = "manual_only", note = "Pricing is published on the pricing page; there is no official pricing API." }

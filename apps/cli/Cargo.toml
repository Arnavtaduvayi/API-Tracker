[package]
name = "api-tracker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.103"
api-tracker-core = { version = "0.1.0", path = "../../crates/core" }
clap = { version = "4.6.2", features = ["derive"] }
rpassword = "7.5.4"
serde = "1.0.228"
serde_json = "1.0.150"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "api-tracker"
path = "src/main.rs"

[package]
name = "api-tracker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.103"
api-tracker-core = { version = "0.1.0", path = "../../crates/core" }
api-tracker-observe = { version = "0.1.0", path = "../../crates/observe" }
clap = { version = "4.6.2", features = ["derive"] }
rpassword = "7.5.4"
serde = "1.0.228"
serde_json = "1.0.150"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.27.0"

# Preferred command after the Tethra rename.
[[bin]]
name = "tethra"
path = "src/main.rs"

# Legacy compatibility entry point: byte-for-byte the same program, kept so
# existing scripts, git hooks, and automation keep working. See
# docs/rebrand/TETHRA_MIGRATION_GUIDE.md.
[[bin]]
name = "api-tracker"
path = "src/main.rs"

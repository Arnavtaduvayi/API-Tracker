[workspace]
resolver = "2"
members = [
    "crates/core",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Arnavtaduvayi/API-Tracker"
rust-version = "1.85"

[workspace.dependencies]
api-tracker-core = { path = "crates/core" }

[profile.release]
strip = true
